<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Realtime Translate Chat</title>
<link rel="stylesheet" href="/css/style.css" />
<!-- PWA(홈 화면에 앱처럼 설치) 관련 태그들 -->
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#3b6ef6" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="번역채팅" />
</head>
<body>

<div class="top-bar">
  <h1 data-i18n="app_name">실시간 번역 채팅</h1>
  <div style="display:flex; align-items:center; gap:10px;">
    <span id="myUsername" class="muted"></span>
    <select class="lang-select" id="topLangSelect">
      <option value="ko">한국어</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="ja">日本語</option>
    </select>
    <button class="small-btn secondary" id="notifyBtn"></button>
    <button class="small-btn secondary" id="logoutBtn" data-i18n="logout_button">로그아웃</button>
  </div>
</div>

<div class="chat-layout" id="chatLayout">
  <div class="sidebar">
    <h3 data-i18n="friends_label">친구 목록</h3>
    <div class="search-row">
      <input id="searchInput" type="text" data-i18n-placeholder="search_placeholder" placeholder="아이디로 친구 검색" />
      <button id="searchBtn" data-i18n="search_button">검색</button>
    </div>
    <div id="searchResults"></div>

    <h3 data-i18n="requests_label">받은 친구 요청</h3>
    <div id="requestList"></div>

    <h3 data-i18n="friends_label">친구 목록</h3>
    <div id="friendList"></div>
  </div>

  <div class="chat-main">
    <div class="chat-header" id="chatHeader">
      <span data-i18n="select_friend_prompt">왼쪽에서 대화할 친구를 선택하세요.</span>
    </div>
    <div class="messages" id="messages"></div>
    <div class="composer" id="composer" style="display:none;">
      <input id="messageInput" type="text" data-i18n-placeholder="message_placeholder" placeholder="메시지를 입력하세요" />
      <button class="small-btn" id="sendBtn" data-i18n="send_button">보내기</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script src="/js/pwa.js"></script>
</body>
</html>
